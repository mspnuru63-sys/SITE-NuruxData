<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NuruxData — Solution de gestion scolaire</title>
<meta name="description" content="NuruxData : solution de gestion scolaire pour établissements préscolaires, primaires, collèges et lycées.">
<style>
  :root{--navy:#0f1f3d;--gold:#c99a2e}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Helvetica,Arial,sans-serif;background:#e9e6df}
  header{height:52px;background:var(--navy);border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .logo{width:28px;height:28px;border-radius:6px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800}
  a.btn{background:var(--gold);color:var(--navy);text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:6px}
  main{height:calc(100% - 52px)}
  object,iframe{width:100%;height:100%;border:0;display:block}
  .fallback{padding:40px 20px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">N</div>NuruxData</div>
  <a class="btn" href="NuruxData_Presentation.pdf" download>Télécharger le PDF</a>
</header>
<main>
  <object data="NuruxData_Presentation.pdf#view=FitH" type="application/pdf">
    <div class="fallback">
      <p>Votre navigateur ne peut pas afficher le PDF directement.</p>
      <a class="btn" href="NuruxData_Presentation.pdf">Ouvrir la présentation</a>
    </div>
  </object>
</main>
</body>
</html>
